<?xml version="1.0" encoding="UTF-8"?>
<!--
  xbot 应用图标（单层矢量 / 1024×1024）
  设计纪律见 docs/BRAND.md：
    · 满幅方形底 —— 圆角交给系统桌面遮罩，图标自身**不画圆角**（避免双重圆角）
    · 色彩一律取设计系统 token：accent #7C5CFF（core/theme.ets darkPalette.accent）
    · 无渐变、无描边、无阴影 —— 极简两色（accent 底 + 白色对话体 + accent 星芒）
  语义：圆角对话气泡 =「对话」；气泡内四角星芒 =「智能体 / 生成」。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 底：满幅强调色（系统桌面会自行施加圆角/形状遮罩） -->
  <rect x="0" y="0" width="1024" height="1024" fill="#7C5CFF"/>

  <!-- 对话气泡：圆角方 + 左下角尾巴；白填充 -->
  <path fill="#FFFFFF" d="
    M 372 232
    H 652
    A 148 148 0 0 1 800 380
    V 552
    A 148 148 0 0 1 652 700
    H 476
    L 300 844
    L 300 700
    H 372
    A 148 148 0 0 1 224 552
    V 380
    A 148 148 0 0 1 372 232
    Z"/>

  <!-- 星芒：四角星，居中于气泡主体（512,466），与底色同色 -->
  <path fill="#7C5CFF" d="
    M 512 346
    Q 512 466 632 466
    Q 512 466 512 586
    Q 512 466 392 466
    Q 512 466 512 346
    Z"/>
</svg>
