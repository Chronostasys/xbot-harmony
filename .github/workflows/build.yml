name: Build HAP

# 云端构建 HarmonyOS HAP（**无需 DevEco Studio**，全程在 Linux runner 内完成）。
#
# 原理：官方 command-line-tools（内含 hvigorw / ohpm / SDK / Node）跑在容器里，
# 所以 Windows/macOS 不是必要条件 —— Linux 一样能编译出 .hap，这正是本 workflow 存在的理由。
#
# 产出：未签名 debug HAP（artifact）；push 到 main 时额外发布滚动 nightly Release。

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      image:
        description: '覆盖 CI 镜像（ghcr.io/owner/harmonyos-ci:<tag>）'
        required: false
        default: ''

concurrency:
  group: build-hap-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash

env:
  # 与 build-profile.json5 的 compatibleSdkVersion（26.0.0）对齐。
  # 换 SDK 时两者必须同改，见 docs/CI.md。
  CI_IMAGE: ghcr.io/dalongzhuazi/harmonyos-ci:api26r

jobs:
  guard:
    name: 判定是否为 HarmonyOS 工程
    runs-on: ubuntu-latest
    outputs:
      is_project: ${{ steps.check.outputs.is_project }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f build-profile.json5 ] && [ -f oh-package.json5 ]; then
            echo "is_project=true" >> "$GITHUB_OUTPUT"
            echo "HarmonyOS 工程已识别"
          else
            echo "is_project=false" >> "$GITHUB_OUTPUT"
            echo "::error::缺少 build-profile.json5 / oh-package.json5"
            exit 1
          fi

  prepare:
    needs: guard
    name: 解析 CI 镜像
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.img.outputs.image }}
    steps:
      - id: img
        env:
          INPUT_IMAGE: ${{ inputs.image }}
          DEFAULT_IMAGE: ${{ env.CI_IMAGE }}
        run: |
          image="${INPUT_IMAGE:-$DEFAULT_IMAGE}"
          echo "使用镜像: $image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

  build:
    name: 构建 HAP（debug / 未签名）
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.prepare.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: 剥离本机签名配置
        run: |
          if [ -f .github/scripts/strip_signing.py ]; then
            python3 .github/scripts/strip_signing.py build-profile.json5
          else
            echo "::notice::未找到 strip_signing.py，跳过"
          fi

      - name: 环境自检（工具链版本）
        run: |
          set -x
          which ohpm hvigorw
          ohpm -v || true
          hvigorw -v || true
          node -v
          java -version 2>&1 | head -3 || true

      - name: 缓存 hvigor / oh_modules
        uses: actions/cache@v4
        with:
          path: |
            /root/.hvigor
            **/oh_modules
          key: hvigor-${{ runner.os }}-${{ hashFiles('**/oh-package-lock.json5') }}
          restore-keys: |
            hvigor-${{ runner.os }}-

      - name: 安装依赖（ohpm）
        run: ohpm install --all

      - name: 编译（hvigorw assembleHap）
        run: hvigorw assembleHap --mode module -p product=default -p buildMode=debug --no-daemon --stacktrace

      - name: 收集并校验产物
        run: |
          set -eu
          mkdir -p dist
          find . -type f -name '*.hap' -path '*/outputs/*' \
            -not -path './oh_modules/*' -not -path './node_modules/*' \
            -exec cp -v {} dist/ \;
          shopt -s nullglob
          haps=(dist/*.hap)
          if [ ${#haps[@]} -eq 0 ]; then
            echo "::error::未产出 .hap —— 请检查上方构建日志"
            exit 1
          fi
          for h in "${haps[@]}"; do
            size=$(stat -c%s "$h")
            [ "$size" -gt 0 ] || { echo "::error::$h 为空"; exit 1; }
            echo "$h : $size bytes"
            # HAP 是 zip：校验 PK 魔数，避免"构建成功但产物是坏文件"
            head -c 2 "$h" | xxd -p | grep -qi '^504b' || { echo "::error::$h 不是合法 zip/HAP"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: hap-unsigned
          path: dist/
          if-no-files-found: error
          retention-days: 14

  nightly:
    name: 滚动 nightly Release
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hap-unsigned
          path: dist
      - name: 列出产物
        run: ls -al dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: nightly
          prerelease: true
          body: |
            自动构建的**未签名** HAP（滚动更新）。
            Unsigned HAP built automatically from `${{ github.sha }}`.

            安装需要先自行签名（见 docs/CI.md），或使用 `sign-and-release` workflow 的签名产物。
          files: dist/*.hap
