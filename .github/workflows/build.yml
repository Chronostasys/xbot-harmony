name: Build HAP

# 云端构建 HarmonyOS HAP —— **不需要 DevEco Studio，也不需要 Windows/macOS**。
#
# 做法：直接下载官方 command-line-tools（含 hvigorw / ohpm / SDK / Node）到 Linux runner 内解包构建。
# 为什么不用预置 Docker 镜像：① 镜像 ~3GB，拉取是构建耗时的大头；② 镜像版本固定，
# 而本仓库需要**按目标鸿蒙版本选 SDK**（见 docs/CI.md「SDK 选型」）。
#
# 默认目标 = 最老可用的 HarmonyOS 5.0.5（`compatibleSdkVersion: 5.0.0(12)`）
# ⇒ 同一个 HAP 覆盖 HarmonyOS 5.0.0 及以上的手机（含 5.x / 6.x）。
# 需要给更新的系统出包时，用 workflow_dispatch 覆盖 sdk_tag / compatible_sdk。

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      sdk_tag:
        description: 'command-line-tools 版本（ErBWs/ohos-sdk 的 tag：5.0.13.200 / 5.1.0.840 / 6.1.1.280 / 26.0.0.821）'
        required: false
        default: '5.0.13.200'
      compatible_sdk:
        description: '留空 = 用 SDK 自身版本（如 5.0.5(17)）；也可显式指定'
        required: false
        default: ''

concurrency:
  group: build-hap-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CLI_DIR: ${{ github.workspace }}/.ohos-cli/command-line-tools

jobs:
  prepare:
    name: 解析目标 SDK
    runs-on: ubuntu-latest
    outputs:
      sdk_tag: ${{ steps.p.outputs.sdk_tag }}
      compatible: ${{ steps.p.outputs.compatible }}
    steps:
      - id: p
        env:
          IN_TAG: ${{ inputs.sdk_tag }}
          IN_COMPAT: ${{ inputs.compatible_sdk }}
        run: |
          tag="${IN_TAG:-5.0.13.200}"
          compat="${IN_COMPAT:-5.0.0(12)}"
          echo "sdk_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "compatible=$compat" >> "$GITHUB_OUTPUT"
          echo "目标 SDK: $tag ；compatibleSdkVersion: $compat"

  static-check:
    name: 静态检查（core/ 用 tsc，秒级）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm i -g typescript@5
      - run: tools/typecheck/check.sh

  build:
    name: 构建 HAP（debug / 未签名）
    needs: prepare
    runs-on: ubuntu-latest
    env:
      SDK_TAG: ${{ needs.prepare.outputs.sdk_tag }}
      COMPATIBLE_SDK: ${{ needs.prepare.outputs.compatible }}
      OHOS_SDK_HOME: ${{ github.workspace }}/.ohos-cli/command-line-tools/sdk
      HOS_SDK_HOME: ${{ github.workspace }}/.ohos-cli/command-line-tools/sdk
    steps:
      - uses: actions/checkout@v4

      - name: 缓存 command-line-tools
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ohos-cli
          key: ohos-cli-${{ runner.os }}-${{ env.SDK_TAG }}

      - name: 下载并解包 command-line-tools
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .ohos-cli && cd .ohos-cli
          gh release download "$SDK_TAG" -R ErBWs/ohos-sdk \
            -p 'ohos-sdk-linux-amd64.tar.gz.*'
          # 分片必须拼成 .sha256 里记录的那个名字，否则 sha256sum -c 找不到文件
          cat ohos-sdk-linux-amd64.tar.gz.aa ohos-sdk-linux-amd64.tar.gz.ab > ohos-sdk-linux-amd64.tar.gz
          sha256sum -c ohos-sdk-linux-amd64.tar.gz.sha256
          tar -xzf ohos-sdk-linux-amd64.tar.gz
          rm -f ohos-sdk-linux-amd64.tar.gz ohos-sdk-linux-amd64.tar.gz.aa ohos-sdk-linux-amd64.tar.gz.ab
          echo "--- 解包结果 ---"
          ls -la
          find . -maxdepth 3 \( -name hvigorw -o -name ohpm \) | head

      - name: 工具链自检
        run: |
          set -x
          echo "$CLI_DIR/bin" >> "$GITHUB_PATH"
          export PATH="$CLI_DIR/bin:$PATH"
          ls -la "$CLI_DIR" || true
          which ohpm hvigorw || true
          node -v
          java -version 2>&1 | head -2 || true

      - name: 安装 JDK（打包/签名工具是 Java）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 对齐 SDK 版本（modelVersion + compatible/targetSdkVersion）
        env:
          COMPATIBLE_IN: ${{ needs.prepare.outputs.compatible }}
        run: |
          # sdk-pkg.json 是工具链自带的权威版本信息
          PKG=.ohos-cli/command-line-tools/sdk/default/sdk-pkg.json
          PLATFORM=$(python3 -c "import json;print(json.load(open('$PKG'))['data']['platformVersion'])")
          API=$(python3 -c "import json;print(json.load(open('$PKG'))['data']['apiVersion'])")
          echo "SDK: platformVersion=$PLATFORM apiVersion=$API"
          # ⛔ modelVersion 必须与工具链一致，否则 hvigor 直接拒绝：
          #    Unsupported modelVersion of Hvigor X. The supported Hvigor modelVersion is Y
          sed -i "s/\"modelVersion\": \"[^\"]*\"/\"modelVersion\": \"$PLATFORM\"/" oh-package.json5 hvigor/hvigor-config.json5
          # compatibleSdkVersion：显式输入优先；留空则用 SDK 自身版本（能装的东西最多）
          CS="$COMPATIBLE_IN"
          if [ -z "$CS" ]; then CS="$PLATFORM($API)"; fi
          sed -i "s/\"compatibleSdkVersion\": \"[^\"]*\"/\"compatibleSdkVersion\": \"$CS\"/" build-profile.json5
          sed -i "s/\"targetSdkVersion\": \"[^\"]*\"/\"targetSdkVersion\": \"$CS\"/" build-profile.json5
          grep -nE "modelVersion" oh-package.json5 hvigor/hvigor-config.json5
          grep -nE "compatibleSdkVersion|targetSdkVersion" build-profile.json5

      - name: 写 local.properties（hvigor 定位 SDK）
        run: |
          echo "sdk.dir=$CLI_DIR/sdk" > local.properties
          cat local.properties

      - name: 安装依赖（ohpm）
        run: |
          export PATH="$CLI_DIR/bin:$PATH"
          ohpm install --all

      - name: 编译（hvigorw assembleHap）
        run: |
          export PATH="$CLI_DIR/bin:$PATH"
          hvigorw --version || true
          hvigorw assembleHap --mode module -p product=default -p buildMode=debug --no-daemon --stacktrace

      - name: 收集并校验产物
        run: |
          set -eu
          mkdir -p dist
          find . -type f -name '*.hap' -path '*/outputs/*' \
            -not -path './.ohos-cli/*' -not -path './oh_modules/*' \
            -exec cp -v {} dist/ \;
          shopt -s nullglob
          haps=(dist/*.hap)
          [ ${#haps[@]} -gt 0 ] || { echo "::error::未产出 .hap —— 检查上方构建日志"; exit 1; }
          for h in "${haps[@]}"; do
            size=$(stat -c%s "$h")
            [ "$size" -gt 0 ] || { echo "::error::$h 为空"; exit 1; }
            # HAP 是 zip（PK\x03\x04）——用纯 bash 校验，别依赖 xxd 之类的可选工具
            magic=$(head -c 2 "$h")
            [ "$magic" = "PK" ] || { echo "::error::$h 不是合法 zip/HAP（magic=$magic）"; exit 1; }
            echo "$h : $size bytes"
            echo "  --- module.json 头部（minAPIVersion/targetAPIVersion）---"
            unzip -p "$h" module.json 2>/dev/null | head -c 400 || true
            echo
          done

      - uses: actions/upload-artifact@v4
        with:
          name: hap-unsigned-${{ needs.prepare.outputs.sdk_tag }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: 发布到 Release（nightly）
    needs: [prepare, build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hap-unsigned-${{ needs.prepare.outputs.sdk_tag }}
          path: dist
      - run: ls -al dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: nightly（未签名）
          prerelease: true
          body: |
            自动构建的**未签名** HAP（滚动更新）。
            目标 SDK：`${{ needs.prepare.outputs.sdk_tag }}`，compatibleSdkVersion：`${{ needs.prepare.outputs.compatible }}`。

            ⚠️ 未签名包不能直接安装：需先签名（见 docs/CI.md），或配置签名 Secrets 走 `Sign & Release` workflow。
          files: dist/*.hap
