name: "Sign & Release"

# tag（v*）触发：构建 release → **签名** → 发布带签名 HAP 的 GitHub Release。
#
# 全程 Linux：command-line-tools（来自 ErBWs/ohos-sdk 的分片 tar.gz）+ 官方
# `hap-sign-tool.jar`（Java）签名 —— 不需要 DevEco Studio。
#
# 需要的 Secrets（缺任一项则本 workflow **干净跳过**，不报红）：
#   SIGNING_KEY_B64            密钥库 .p12 的 base64
#   SIGNING_CERT_B64           证书 .cer 的 base64
#   SIGNING_PROFILE_B64        Profile .p7b 的 base64
#   SIGNING_KEY_PASSWORD       密钥库口令
#   SIGNING_KEY_ALIAS          密钥别名（默认 xbot）
#   SIGNING_PROFILE_PASSWORD   Profile 口令（无则留空）
# 生成步骤见 docs/CI.md「签名」。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  SDK_TAG: 5.0.13.200
  COMPATIBLE_SDK: ""
  CLI_DIR: ${{ github.workspace }}/.ohos-cli/command-line-tools

jobs:
  preflight:
    name: 判定是否具备签名材料
    runs-on: ubuntu-latest
    outputs:
      can_sign: ${{ steps.check.outputs.can_sign }}
    steps:
      - id: check
        env:
          K: ${{ secrets.SIGNING_KEY_B64 }}
          C: ${{ secrets.SIGNING_CERT_B64 }}
          P: ${{ secrets.SIGNING_PROFILE_B64 }}
        run: |
          if [ -n "$K" ] && [ -n "$C" ] && [ -n "$P" ]; then
            echo "can_sign=true" >> "$GITHUB_OUTPUT"
            echo "签名材料齐全"
          else
            echo "can_sign=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置签名 Secrets，跳过签名发布（请先按 docs/CI.md 配置）"
          fi

  release:
    needs: preflight
    if: needs.preflight.outputs.can_sign == 'true'
    name: 构建 + 签名 + 发布
    runs-on: ubuntu-latest
    env:
      OHOS_SDK_HOME: ${{ github.workspace }}/.ohos-cli/command-line-tools/sdk
      HOS_SDK_HOME: ${{ github.workspace }}/.ohos-cli/command-line-tools/sdk
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_PROFILE_PASSWORD: ${{ secrets.SIGNING_PROFILE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: 缓存 command-line-tools
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ohos-cli
          key: ohos-cli-linux-${{ env.SDK_TAG }}

      - name: 下载并解包 command-line-tools
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .ohos-cli && cd .ohos-cli
          gh release download "$SDK_TAG" -R ErBWs/ohos-sdk -p 'ohos-sdk-linux-amd64.tar.gz.*'
          cat ohos-sdk-linux-amd64.tar.gz.aa ohos-sdk-linux-amd64.tar.gz.ab > ohos-sdk-linux-amd64.tar.gz
          sha256sum -c ohos-sdk-linux-amd64.tar.gz.sha256
          tar -xzf ohos-sdk-linux-amd64.tar.gz
          rm -f ohos-sdk-linux-amd64.tar.gz ohos-sdk-linux-amd64.tar.gz.aa ohos-sdk-linux-amd64.tar.gz.ab

      - name: 还原签名材料
        env:
          SIGNING_KEY_B64: ${{ secrets.SIGNING_KEY_B64 }}
          SIGNING_CERT_B64: ${{ secrets.SIGNING_CERT_B64 }}
          SIGNING_PROFILE_B64: ${{ secrets.SIGNING_PROFILE_B64 }}
        run: |
          set -eu
          mkdir -p .signing
          printf '%s' "$SIGNING_KEY_B64"     | base64 -d > .signing/xbot.p12
          printf '%s' "$SIGNING_CERT_B64"    | base64 -d > .signing/xbot.cer
          printf '%s' "$SIGNING_PROFILE_B64" | base64 -d > .signing/xbot.p7b
          ls -al .signing

      - name: 安装 JDK（打包/签名工具是 Java）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 对齐 SDK 版本（modelVersion + compatible/targetSdkVersion）
        run: |
          PKG=.ohos-cli/command-line-tools/sdk/default/sdk-pkg.json
          PLATFORM=$(python3 -c "import json;print(json.load(open('$PKG'))['data']['platformVersion'])")
          API=$(python3 -c "import json;print(json.load(open('$PKG'))['data']['apiVersion'])")
          echo "SDK: platformVersion=$PLATFORM apiVersion=$API"
          sed -i "s/\"modelVersion\": \"[^\"]*\"/\"modelVersion\": \"$PLATFORM\"/" oh-package.json5 hvigor/hvigor-config.json5
          CS="$COMPATIBLE_SDK"
          if [ -z "$CS" ]; then CS="$PLATFORM($API)"; fi
          sed -i "s/\"compatibleSdkVersion\": \"[^\"]*\"/\"compatibleSdkVersion\": \"$CS\"/" build-profile.json5
          sed -i "s/\"targetSdkVersion\": \"[^\"]*\"/\"targetSdkVersion\": \"$CS\"/" build-profile.json5
          echo "sdk.dir=$CLI_DIR/sdk" > local.properties
          grep -nE "modelVersion" oh-package.json5 hvigor/hvigor-config.json5
          grep -nE "compatibleSdkVersion|targetSdkVersion" build-profile.json5

      - name: 安装依赖 + 构建 release HAP
        run: |
          export PATH="$CLI_DIR/bin:$PATH"
          ohpm install --all
          hvigorw assembleHap --mode module -p product=default -p buildMode=release --no-daemon --stacktrace

      - name: 签名（hap-sign-tool.jar）
        run: |
          set -eu
          TOOL=$(find "$CLI_DIR" -name 'hap-sign-tool.jar' | head -1)
          [ -n "$TOOL" ] || { echo "::error::工具链内未找到 hap-sign-tool.jar"; exit 1; }
          echo "sign tool: $TOOL"
          mkdir -p dist
          shopt -s nullglob
          found=0
          for h in $(find . -type f -name '*-unsigned.hap' -path '*/outputs/*' -not -path './.ohos-cli/*'); do
            found=1
            out="dist/$(basename "${h%-unsigned.hap}").hap"
            java -jar "$TOOL" sign-app \
              -mode localSign \
              -keyAlias "${SIGNING_KEY_ALIAS:-xbot}" \
              -signAlg SHA256withECDSA \
              -appCertFile .signing/xbot.cer \
              -profileFile .signing/xbot.p7b \
              -inFile "$h" \
              -keystoreFile .signing/xbot.p12 \
              -outFile "$out" \
              -keyPwd "$SIGNING_KEY_PASSWORD" \
              -keystorePwd "$SIGNING_KEY_PASSWORD" \
              ${SIGNING_PROFILE_PASSWORD:+-profilePwd "$SIGNING_PROFILE_PASSWORD"}
            echo "signed: $out"
            java -jar "$TOOL" verify-app -inFile "$out" -outFile "dist/verify-$(basename "$out").json" || true
          done
          [ "$found" = "1" ] || { echo "::error::未找到 *-unsigned.hap 产物"; exit 1; }
          ls -al dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.hap
          generate_release_notes: true
